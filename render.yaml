services:
  - type: web
    name: sistema-asistencia
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-db
          property: connectionString
      # ⚠️ IMPORTANTE: Configura estas variables manualmente en el dashboard de Render:
      # - JWT_SECRET         → genera con: openssl rand -base64 64
      # - SUPER_ADMIN_KEY    → genera con: openssl rand -hex 32
      # - ALLOWED_ORIGINS    → ej: https://tuapp.onrender.com
      # - MERCADOPAGO_ACCESS_TOKEN
      # - TWILIO_ACCOUNT_SID
      # - TWILIO_AUTH_TOKEN
      # - TWILIO_PHONE_NUMBER

databases:
  - name: asistencia-db
    databaseName: asistencia
    user: admin
    plan: free
